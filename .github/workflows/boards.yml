name: Board Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boards:
    runs-on: ubuntu-latest
    env:
      GCC_PREFIX: ${{ startsWith(matrix.board, 'esp32c6') && 'riscv64-unknown-elf-' || '' }}
    strategy:
      matrix:
        board: [stm32wb55xx_nucleo, stm32wba55cg_nucleo, stm32wb05kz_nucleo, pic32cz_curiosity_ultra, stm32h563zi_nucleo, stm32f411_blackpill, stm32c031_nucleo, stm32f091rc_nucleo, stm32f302r8_nucleo, stm32l152re_nucleo, stm32n657a0_nucleo, stm32u5a5zj_nucleo, esp32c6_devkitc1, esp32c6_xiao]
        extra_cflags: ["", "-DWHAL_CFG_NO_TIMEOUT"]
        include:
          - board: stm32wb55xx_nucleo
            extra_cflags: "-DBOARD_DMA"
          - board: esp32c6_devkitc1
            extra_cflags: ""
            radio: "1"
          - board: esp32c6_xiao
            extra_cflags: ""
            radio: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        if: ${{ !startsWith(matrix.board, 'esp32c6') }}
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Install RISC-V toolchain
        if: startsWith(matrix.board, 'esp32c6')
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Fetch ESP32-C6 radio libraries
        if: matrix.radio
        run: ./tools/esp32c6_radio/fetch_blobs.sh

      - name: Build blinky
        working-directory: examples/blinky
        run: CFLAGS="${{ matrix.extra_cflags }}" make BOARD=${{ matrix.board }} RADIO=${{ matrix.radio }}

      - name: Build tests
        working-directory: tests
        run: CFLAGS="${{ matrix.extra_cflags }}" make BOARD=${{ matrix.board }} RADIO=${{ matrix.radio }}

      - name: Build ieee802154_ping
        if: matrix.radio
        working-directory: examples/ieee802154_ping
        run: CFLAGS="${{ matrix.extra_cflags }}" make BOARD=${{ matrix.board }}
